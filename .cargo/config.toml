[net]
git-fetch-with-cli = true

[unstable]
# Rebuild std with atomics support for wasm32
build-std = ["std", "panic_abort"]

[target.'cfg(target_arch="wasm32")']
runner = ["wasm_lite", "run"]
rustflags = [
    "-C", "target-feature=+atomics",
    # see https://github.com/wasm-bindgen/wasm-bindgen/issues/4727
    # and https://github.com/rust-lang/rust/pull/147225
    "-Clink-arg=--shared-memory",
    # 4GB
    "-Clink-arg=--max-memory=4294967296",
    "-Clink-arg=--import-memory",
    "-Clink-arg=--export=__stack_pointer",
    "-Clink-arg=--export=__wasm_init_tls",
    "-Clink-arg=--export=__tls_size",
    "-Zunstable-options",
]

# Note: cfg() predicates don't work for rustdocflags, so we need a separate
# target section with the exact triple for doctests to get shared memory support

[target.wasm32-unknown-unknown]
rustdocflags = [
    "-C", "target-feature=+atomics",
    "-Clink-arg=--shared-memory",
    "-Clink-arg=--max-memory=4294967296",
    "-Clink-arg=--import-memory",
    "-Clink-arg=--export=__stack_pointer",
    "-Clink-arg=--export=__wasm_init_tls",
    "-Clink-arg=--export=__tls_size",
    "-Zunstable-options",
]
