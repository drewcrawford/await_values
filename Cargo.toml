[package]
name = "await_values"
version = "0.2.0"
edition = "2024"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
description = "Primitives for subscribing to / notifying about changes to values"
repository = "https://github.com/drewcrawford/await_values"
homepage = "https://sealedabstract.com/code/await_values"
license = "MIT OR Apache-2.0"
keywords = ["await","observer", "subscriber", "observable"]
categories = ["asynchronous", "concurrency", "gui", "rust-patterns"]
exclude = [".*"]
rust-version = "1.85.1"


[dependencies]
atomic-waker = "~1"
treiber_stack = "1.1"
# TODO: back to a crates.io version once wasm_lite releases the test support
# used below (native `#[wasm_lite_test]`, async bodies, public `block_on`).
wasm_lite_std = { path = "../wasm_lite/crates/wasm_lite_std" }
futures-core = "0.3.31"
[dev-dependencies]
futures-util = "0.3"
# Provides `#[wasm_lite_test]`, which is one attribute for both targets: a libtest
# `#[test]` off wasm32, a browser test on it. Needed on every target, not just
# wasm32. See the TODO above about getting both of these back onto crates.io.
wasm_lite = { path = "../wasm_lite/crates/wasm_lite" }
