[package]
name = "await_values"
version = "0.3.1"
edition = "2024"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
description = "Primitives for subscribing to / notifying about changes to values"
repository = "https://github.com/drewcrawford/await_values"
homepage = "https://sealedabstract.com/code/await_values"
license = "MIT OR Apache-2.0"
keywords = ["await","observer", "subscriber", "observable"]
categories = ["asynchronous", "concurrency", "gui", "rust-patterns"]
exclude = [".*"]
# Set by wasm_lite_std 0.1.2, which is itself 1.95.0. Nothing in this crate
# needs anything newer than 1.85 on its own.
rust-version = "1.95.0"


[features]
default = []
# A bounded registry of observable values, exposed through exfiltrate's
# `snapshot` command. Off by default: the registry costs an update per `set`.
exfiltrate = ["dep:exfiltrate"]

[dependencies]
atomic-waker = "~1"
treiber_stack = "1.1"
wasm_lite_std = "0.1.2"
futures-core = "0.3.31"
exfiltrate = { version = "0.4.0", optional = true }
[dev-dependencies]
futures-util = "0.3"
# For decoding the structured `snapshot` responses in the registry test.
rmp-serde = "1.3.1"
exfiltrate_internal = { version = "0.4.0" }
# Provides `#[wasm_lite_test]`, which is one attribute for both targets: a libtest
# `#[test]` off wasm32, a browser test on it. Needed on every target, not just
# wasm32.
wasm_lite = "0.1.2"

# Its own binary: the registry is process-global, so a case asserting on its
# contents cannot share a process with the crate's other tests.
[[test]]
name = "registry"
path = "tests/registry.rs"
required-features = ["exfiltrate"]
